services:
  - type: web
    name: sentinel-derm
    runtime: python
    # requirements.txt pins torch and torchvision to CPU-only wheels from the
    # PyTorch index, so a single install is enough and no CUDA wheels are pulled.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
