services:
  - type: web
    name: sentinel-derm
    runtime: python
    # torch CPU wheels are installed from the PyTorch index first so the build
    # does not pull the multi-gigabyte CUDA wheels from PyPI.
    buildCommand: >-
      pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision &&
      pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
